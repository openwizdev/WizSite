name: Site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    name: Build, links, resources and privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build static site
        run: npm run build
      - name: Check links, resources and privacy
        run: npm run check
      - name: Test the checkers
        run: npm test
      - name: Test the sign-in helper against a fake GitHub
        run: npm run test:functions
      - name: Test the app in a browser against recorded GitHub answers
        run: npm run test:app
