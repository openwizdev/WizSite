name: Site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    name: Build, links, resources and privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check added comments against contracts/comments.v1.md
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --no-tags --depth=2 origin "$GITHUB_SHA"
          python3 -I tools/comment-check/check.py diff --base HEAD^1
      - name: Install the pinned npm dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Check links, resources and privacy
        run: npm run check
      - name: Test the checkers
        run: npm test
      - name: Test the sign-in helper against a fake GitHub
        run: npm run test:functions
      - name: Test the app in a browser against recorded GitHub answers
        run: npm run test:app
      - name: Test the v2 app records contract and the v2 browser tests
        run: npm run test:v2
      - name: Test the Models page against the models contract's fixtures
        run: node --test tests/models-page.test.mjs
